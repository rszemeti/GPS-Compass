import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
def hasKeystoreProperties = keystorePropertiesFile.exists()

if (hasKeystoreProperties) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

def releaseStoreFilePath = keystoreProperties.getProperty('storeFile')
def releaseStoreFile = releaseStoreFilePath ? rootProject.file(releaseStoreFilePath) : null
def hasReleaseSigning = hasKeystoreProperties && releaseStoreFile?.exists()
def repoReleaseDir = new File(rootProject.projectDir.parentFile, 'release')

android {
    namespace 'com.example.gpsheading'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.gpsheading"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Java/Kotlin toolchains
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    // Compose
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion "1.5.14"
    }
}

dependencies {
    // Compose BOM controls the versions of androidx.compose.* libs
    implementation platform("androidx.compose:compose-bom:2024.06.00")

    // Compose UI + Material3 (Compose)
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.activity:activity-compose:1.9.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // ---- Add these so XML Material3 theme & attrs resolve ----
    implementation "com.google.android.material:material:1.12.0" // provides Theme.Material3.* in XML
    implementation "androidx.appcompat:appcompat:1.7.0"

    // (Optional but handy)
    implementation "androidx.core:core-ktx:1.13.1"
}

def repoReleaseApkName = "gps-compass-android-${android.defaultConfig.versionName}.apk"

tasks.register('printReleaseSigningStatus') {
    doLast {
        if (hasReleaseSigning) {
            println 'Release signing is configured via Android_client/keystore.properties.'
        } else if (hasKeystoreProperties) {
            println 'Release signing properties exist, but the keystore file was not found at: ' + (releaseStoreFilePath ?: '<missing storeFile>')
        } else {
            println 'Release signing is not configured. Copy Android_client/keystore.properties.example to Android_client/keystore.properties to enable signed sideloadable release builds.'
        }
    }
}

tasks.register('copySignedReleaseApk', Copy) {
    dependsOn 'assembleRelease'
    from(layout.buildDirectory.file('outputs/apk/release/app-release.apk'))
    into(repoReleaseDir)
    rename { repoReleaseApkName }

    doFirst {
        if (!hasReleaseSigning) {
            throw new GradleException('Release signing must be configured before copying a signed release APK.')
        }
        repoReleaseDir.mkdirs()
    }
}
